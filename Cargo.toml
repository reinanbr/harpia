[workspace]
resolver = "3"
members = [
    "crates/harpia-core",
    "crates/harpia-text",
    "crates/harpia-data",
    "crates/harpia-structured",
    "crates/harpia-http",
    "crates/harpia-client",
    "crates/harpia-local",
    "crates/harpia-train",
    "crates/harpia-eval",
    "crates/harpia-verify",
    "crates/harpia",
    "crates/harpia-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/harpia-rs/harpia"
homepage = "https://github.com/harpia-rs/harpia"
authors = ["Harpia contributors"]
readme = "README.md"

[workspace.dependencies]
# internal
harpia-core = { path = "crates/harpia-core", version = "0.1.0" }
harpia-text = { path = "crates/harpia-text", version = "0.1.0" }
harpia-data = { path = "crates/harpia-data", version = "0.1.0", default-features = false }
harpia-structured = { path = "crates/harpia-structured", version = "0.1.0" }
harpia-http = { path = "crates/harpia-http", version = "0.1.0", default-features = false }
harpia-client = { path = "crates/harpia-client", version = "0.1.0", default-features = false }
harpia-local = { path = "crates/harpia-local", version = "0.1.0" }
harpia-train = { path = "crates/harpia-train", version = "0.1.0" }
harpia-eval = { path = "crates/harpia-eval", version = "0.1.0" }
harpia-verify = { path = "crates/harpia-verify", version = "0.1.0" }
harpia = { path = "crates/harpia", version = "0.1.0" }

# external (pure Rust; audit features before adding anything here)
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
futures-core = "0.3"
unicode-normalization = "0.1"
regex = "1.11"
regex-automata = "0.4"
aho-corasick = "1.1"
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
whatlang = "0.18"
minijinja = { version = "3.0", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.0", features = ["pycompat"] }
toml = "1.0"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
jsonschema = { version = "0.60", default-features = false }
schemars = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.45", default-features = false, features = ["rt", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1.10"
redb = "4.0"
sha2 = "0.11"
httpdate = "1.0"
tracing = "0.1"
wiremock = "0.6"

# dev
proptest = "1.6"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
