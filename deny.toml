# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable); it is a build-time proc-macro of candle's `gemm`.
    # Revisit when candle drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled by candle/gemm; no vulnerability" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # permissive: fluent-uri (via jsonschema)
    "MIT-0",
    # permissive data license of the Mozilla CA bundle (webpki roots, `tls` feature only)
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Pure-Rust guarantee: these pull C/C++ code and are forbidden in the default graph.
deny = [
    { crate = "openssl-sys" },
    { crate = "onig_sys" },
    { crate = "libsqlite3-sys" },
    { crate = "zstd-sys" },
    { crate = "libz-sys" },
    { crate = "bzip2-sys" },
    { crate = "lzma-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
