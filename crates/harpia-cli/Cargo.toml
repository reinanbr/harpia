[package]
name = "harpia-cli"
description = "The `harpia` command line: text utilities, dataset curation, chat templates, packing and JSON repair."
keywords = ["llm", "cli", "dataset", "nlp"]
categories = ["command-line-utilities", "science", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = ["tls"]
## HTTPS for `harpia chat` and `data synth` against hosted APIs (rustls + ring, needs a C compiler).
## Build with `--no-default-features` for a pure-Rust binary that talks to `http://` servers only.
tls = ["harpia/tls"]

[[bin]]
name = "harpia"
path = "src/main.rs"
# the library crate `harpia` documents the API; avoid a rustdoc name collision
doc = false

[dependencies]
harpia = { workspace = true, features = ["full"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures-util = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
