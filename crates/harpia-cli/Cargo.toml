[package]
name = "harpia-cli"
description = "The `harpia` command line: text utilities, dataset curation, chat templates, packing and JSON repair."
keywords = ["llm", "cli", "dataset", "nlp"]
categories = ["command-line-utilities", "science", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "harpia"
path = "src/main.rs"
# the library crate `harpia` documents the API; avoid a rustdoc name collision
doc = false

[dependencies]
harpia = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
