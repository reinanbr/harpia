[package]
name = "harpia-local"
description = "Pure-Rust local inference with candle: encoders (sequence/pair classifiers, embeddings, rerankers), MarianMT translation and decoder LLMs."
keywords = ["llm", "inference", "candle", "transformers", "nlp"]
categories = ["science", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
harpia-core = { workspace = true }
harpia-data = { workspace = true, features = ["tokenizers"] }
harpia-structured = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
futures-core = { workspace = true }
harpia-http = { workspace = true, optional = true }

[features]
default = []
## Hugging Face Hub downloads through harpia-http (explicit cache dir, respects NetworkPolicy).
## Combine with `harpia-http/tls` (or the umbrella `tls`) for https://huggingface.co.
hub = ["dep:harpia-http"]
## NVIDIA GPUs (native code: CUDA toolkit).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
## Apple GPUs (native code: Metal).
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
