# Built-in trusted sources. Extend, restrict or replace them with your own registry file.
# Tier 1 = primary / peer-reviewed metadata, 2 = curated reference, 3 = general.

[[sources]]
id = "crossref"
name = "Crossref"
kind = "scholarly-api"
domains = ["api.crossref.org"]
tier = 1
min_interval_ms = 100
contact_env = "HARPIA_CONTACT_EMAIL"
adapter = "crossref"

[[sources]]
id = "openalex"
name = "OpenAlex"
kind = "scholarly-api"
domains = ["api.openalex.org"]
tier = 1
min_interval_ms = 100
contact_env = "HARPIA_CONTACT_EMAIL"
adapter = "openalex"

[[sources]]
id = "semantic-scholar"
name = "Semantic Scholar"
kind = "scholarly-api"
domains = ["api.semanticscholar.org"]
tier = 1
min_interval_ms = 1100
api_key_env = "SEMANTIC_SCHOLAR_API_KEY"
adapter = "semantic-scholar"

[[sources]]
id = "arxiv"
name = "arXiv"
kind = "scholarly-api"
domains = ["export.arxiv.org"]
tier = 2
min_interval_ms = 3000
adapter = "arxiv"

