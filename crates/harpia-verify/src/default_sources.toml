[[sources]]
id = "open-access-pdf"
name = "Open-access full texts reported by scholarly APIs"
kind = "scholarly-api"
domains = ["arxiv.org", "export.arxiv.org", "europepmc.org", "www.ncbi.nlm.nih.gov", "*.scielo.br", "*.plos.org", "*.biomedcentral.com", "*.springeropen.com", "*.frontiersin.org", "*.mdpi.com"]
tier = 1
min_interval_ms = 1000
adapter = "open-access-pdf"
