[package]
name = "harpia"
description = "Sharp-eyed LLM tooling in pure Rust: data curation, structured output, API clients, local inference, training and evaluation."
keywords = ["llm", "nlp", "dataset", "machine-learning", "ai"]
categories = ["science", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[features]
default = ["text", "data", "structured"]
## Text primitives (segmentation, statistics, similarity, fuzzy matching, BM25).
text = ["dep:harpia-text"]
## Dataset IO, curation, chat templates, packing and chunking.
data = ["text", "dep:harpia-data"]
## JSON extraction/repair, streaming JSON, constrained-decoding grammars, tool calls.
structured = ["dep:harpia-structured"]
## Language identification.
langid = ["text", "harpia-text?/langid", "harpia-data?/langid"]
## Hugging Face tokenizers backend (pure Rust).
tokenizers = ["data", "harpia-data?/tokenizers"]
## JSON Schema validation and schema derivation.
schema = ["structured", "harpia-structured?/schema"]
## Polite HTTP layer (offline by default). Pure Rust; `http://` only unless `tls` is enabled.
http = ["dep:harpia-http"]
## LLM API clients (OpenAI-compatible, Anthropic, Ollama), structured output, batch runner, synthetic data.
client = ["http", "data", "structured", "dep:harpia-client", "harpia-client?/openai-compatible", "harpia-client?/anthropic", "harpia-client?/ollama"]
## HTTPS via rustls + `ring`. NOTE: `ring` contains C/assembly and needs a C compiler.
tls = ["http", "harpia-http?/tls", "harpia-client?/tls"]
## Local inference with candle (encoders, MarianMT, Qwen2/Llama decoders). Pure Rust on CPU.
local = ["data", "structured", "tokenizers", "dep:harpia-local"]
## NVIDIA GPU inference (native code: CUDA).
cuda = ["local", "harpia-local?/cuda"]
## Apple GPU inference (native code: Metal).
metal = ["local", "harpia-local?/metal"]
## Fine-tuning (classifiers, LoRA SFT, DPO). Pure Rust on CPU.
train = ["local", "dep:harpia-train"]
## Everything implemented so far, in pure Rust (add `tls` for HTTPS).
full = ["text", "data", "structured", "langid", "tokenizers", "schema", "http", "client", "local", "train"]

[dependencies]
harpia-core = { workspace = true }
harpia-text = { workspace = true, optional = true }
harpia-data = { workspace = true, optional = true }
harpia-structured = { workspace = true, optional = true }
harpia-http = { workspace = true, optional = true }
harpia-client = { workspace = true, optional = true }
harpia-local = { workspace = true, optional = true }
harpia-train = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
futures-util = { workspace = true }
[dev-dependencies.serde_json]
workspace = true

[[example]]
name = "quickstart"
path = "../../examples/quickstart.rs"
required-features = ["data", "structured"]

[[example]]
name = "llm_data_pipeline"
path = "../../examples/llm_data_pipeline.rs"
required-features = ["data"]

[[example]]
name = "json_repair"
path = "../../examples/json_repair.rs"
required-features = ["structured"]

[[example]]
name = "rag_chunking"
path = "../../examples/rag_chunking.rs"
required-features = ["data"]

[lints]
workspace = true

[[example]]
name = "streaming_client"
path = "../../examples/streaming_client.rs"
required-features = ["client"]
